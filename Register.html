<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <header>
         <h1>Registration</h1>
            <a href="index.html">Home </a>|
            <a href="events.html">Events </a>|
            <a href="Register.html">Register</a>
    </header>
    <hr>
    <h2>Fill this registration form in order to participate.</h2>
    
    <form action="https://formspree.io/f/YOUR_ID" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Full name" required>
        <br><br>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <br><br>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit number" pattern="[6-9][0-9]{9}" maxlength="10">
        <br><br>
        <label for="college">College</label>
        <input type="text" id="college" name="college" placeholder="College name">
        <br><br>
        <label for="branch">Branch</label>
        <input type="text" id="branch" name="branch" placeholder="e.g. CSE">
        <br><br>
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="Your city">
        <br><br>
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
        <br><br>
        <label><input type="checkbox" name="events" value="coding-contest"> Coding Contest</label>
        <label><input type="checkbox" name="events" value="web-design-challenge"> Web Design Challenge</label>
        <br><br>
        <button type="submit">Submit</button>

    </form>
</body>
</html>
